<!DOCTYPE html>
<html>

<head>
    <title>BATTLESHIP</title>
</head>


<link rel="stylesheet" href="style.css">

<body>

  <div class="container">
  
    <div class="sideMenu">
      <button id="btnPlay">Play</button>
      <button >Upgrade</button>
    </div>
    

    <div class="viewPort">
          
      <div class="jetTrack">
        <div id="info" class="info">B A T T L E S H I P</div>
        <img id="jet" class="jetAnimation" src="./img/01.svg" width="100" height="40">
      </div>

      <div class="skyArea">
        <img class="bomb1" src="./img/bomb.gif" width="10" height="35">
        <img class="bomb2" src="./img/bomb.gif" width="10" height="35">
      </div>

      <div class="cannonArea">
        <img id="cannon" tabindex="-1" src="./img/cannon.png" width="50" height="80">
      </div>

    </div>
  
  </div>

  <script src="script.js"></script>

</body>




</html>
